<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - Ordinateur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- connexion et inscription -->
    <div id="zone-connexion">
        <div class="carte-connexion">

            <h1>Bienvenue</h1>
            
            <!-- La page de connexion est affiché par défaut -->
            <div id="bloc-connexion">
                <p class="sous-titre">Connectez-vous pour retrouver vos conversations</p>
                <div class="champ">
                    <!-- logo personne pour le username -->
                    <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                    <input type="text" id="login-username" placeholder="Nom d'utilisateur">
                </div>

                <div class="champ">
                    <!-- logo cadenas pour le mdp -->
                    <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="11" width="14" height="10" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                    </svg>
                    <input type="password" id="login-mdp" placeholder="Mot de passe">
                    <!-- logo oeil quand on clique dessus on voit le mot de passe en clair -->
                    <button id="btn-oeil-login" class="btn-oeil" type="button" title="Afficher le mot de passe">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <button id="btn-connexion" class="bouton">Se connecter</button>

                <div class="separateur"><span>ou</span></div>
                <p class="bascule">
                    Pas encore de compte ?
                    <a href="#" id="lien-inscription">S'inscrire</a>
                </p>
            </div>


            <!-- on affiche cette partie quand on clique sur s'inscrire -->
            <div id="bloc-inscription" style="display: none;">

                <div class="champ">
                    <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                    <input type="text" id="inscription-username" placeholder="Nom d'utilisateur">
                </div>

                <div class="champ">
                    <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="11" width="14" height="10" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                    </svg>

                    <input type="password" id="inscription-mdp" placeholder="Mot de passe">

                    <button id="btn-oeil-inscription" class="btn-oeil" type="button" title="Afficher le mot de passe">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <p class="aide" id="aide-mdp">Entre 6 et 30 caractères, une majuscule et un chiffre</p>
                <button id="btn-inscription" class="bouton">Créer mon compte</button>

                <div class="separateur"><span>ou</span></div>

                <p class="bascule">
                    Déjà un compte ?
                    <a href="#" id="lien-connexion">Se connecter</a>
                </p>
            </div>

            <p id="message-erreur" role="alert"></p>
        </div>
    </div>


    <!-- partie messagerie, elle reste cachée avant la connexion -->
    <div id="zone-messagerie" style="display: none;">

        <!-- la barre avec les logos tout à gauche -->
        <nav id="navigation">
            <!-- logo bulle pour accéder à nos conversations -->
            <button id="onglet-messages" class="onglet actif" title="Messages">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>
                </svg>
            </button>
            <!-- logo personne pour voir tous les utiliosateurs inscrits -->
            <button id="onglet-personnes" class="onglet" title="Personnes">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="8" r="4"/>
                    <path d="M2 21c0-4 3-6 7-6s7 2 7 6"/>
                    <path d="M16 4a4 4 0 0 1 0 8"/>
                    <path d="M18 15c2.5.5 4 2.5 4 6"/>
                </svg>
            </button>
            <!-- logo pour la déconnexion -->
            <button id="btn-deconnexion" class="onglet" title="Déconnexion">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <path d="M16 17l5-5-5-5"/>
                    <path d="M21 12H9"/>
                </svg>
            </button>
        </nav>


        <!-- la liste à gauche -->
        <div id="panneau-liste">
            <h2 id="titre-liste">Messages</h2>
            <p class="moi">Connecté en tant que <span id="mon-username"></span></p>

            <!-- onglet messages : les conversations -->
            <div id="liste-conversations"></div>

            <!-- onglet des utilisateurs -->
            <div id="liste-utilisateurs" style="display: none;"></div>
        </div>


        <!-- conversation avec la personne choisie -->
        <div id="panneau-conversation">

            <div class="entete-conversation">
                <div class="avatar">
                    <!-- Pastille vert si en ligne ou gris sinon -->
                    <span id="pastille-destinataire" class="pastille"></span>
                </div>

                <div>
                    <p id="nom-destinataire"></p>
                    <p id="statut-destinataire"></p>
                </div>
            </div>

            <div id="historique"></div>

            <!-- la zone pour écrire -->
            <div class="barre-envoi">
                <input type="text" id="champ-message" placeholder="Écrire un message...">
                <!-- bouton pour envoyer le message -->
                <button id="btn-envoyer" class="bouton-rond" title="Envoyer">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13"/>
                        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
